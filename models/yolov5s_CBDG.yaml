# YOLOv5s_CBDG 完整模型 (表5.4 消融第4组)
#   C = CA 坐标注意力 (Backbone P3/P4 C3 后 + SPPF 后)
#   B = BiFPN 快速归一化加权融合替换 Neck 的 Concat (论文图4.9)
#   D = DWConv 深度卷积替换 Neck 的标准 Conv
#   G = GhostConv + C3Ghost 替换 Backbone 的 Conv + C3 (论文图5.7, 首层 GhostConv k3s2)
# Neck 的 C3 检测头保持标准 C3 (论文 5.3: 仅 Backbone 的 C3 换 C3Ghost)

nc: 3
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [10, 13, 16, 30, 33, 23]  # P3/8
  - [30, 61, 62, 45, 59, 119]  # P4/16
  - [116, 90, 156, 198, 373, 326]  # P5/32

backbone:
  [[-1, 1, GhostConv, [64, 3, 2]],  # 0-P1/2 (首层 GhostConv, k3 s2, 偶数下采样)
   [-1, 1, GhostConv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3Ghost, [128]],  # 2
   [-1, 1, GhostConv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3Ghost, [256]],  # 4
   [-1, 1, CoordAtt, []],  # 5 <- P3 (128)
   [-1, 1, GhostConv, [512, 3, 2]],  # 6-P4/16
   [-1, 9, C3Ghost, [512]],  # 7
   [-1, 1, CoordAtt, []],  # 8 <- P4 (256)
   [-1, 1, GhostConv, [1024, 3, 2]],  # 9-P5/32
   [-1, 3, C3Ghost, [1024]],  # 10
   [-1, 1, SPPF, [1024, 5]],  # 11
   [-1, 1, CoordAtt, []],  # 12 <- P5 (512)
  ]

head:
  # ---- 自顶向下 (DWConv 替换 Conv) ----
  [[-1, 1, DWConv, [512, 1, 1]],  # 13 P5 降维
   [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 14
   [[-1, 8], 1, BiFPN_Fusion, []],  # 15 TD-P4
   [-1, 1, DWConv, [256, 1, 1]],  # 16
   [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 17
   [[-1, 5], 1, BiFPN_Fusion, []],  # 18 TD-P3
   # ---- 自底向上 ----
   [-1, 1, DWConv, [512, 3, 2]],  # 19 下采样
   [[-1, 15, 8], 1, BiFPN_Fusion, []],  # 20 BU-P4 三输入
   [-1, 1, DWConv, [1024, 3, 2]],  # 21 下采样
   [[-1, 12], 1, BiFPN_Fusion, []],  # 22 BU-P5
   # ---- 检测头 ----
   [18, 1, C3, [256, False]],  # 23 P3/8-small
   [20, 1, C3, [512, False]],  # 24 P4/16-medium
   [22, 1, C3, [1024, False]],  # 25 P5/32-large
   [[23, 24, 25], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
