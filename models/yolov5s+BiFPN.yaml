# YOLOv5s + BiFPN (表4.2 对比实验)
# 将 Neck 的 Concat 拼接替换为 BiFPN 快速归一化加权融合节点 (论文图4.9):
#   自顶向下: P5上采样+P4融合, P4上采样+P3融合
#   自底向上: P3下采样 + [TD-P4 + 原始P4] 三输入同层融合, 再下采样 + 原始P5 融合
# Backbone 保持原版 (P3=4, P4=6, SPPF=9)

nc: 3
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [10, 13, 16, 30, 33, 23]  # P3/8
  - [30, 61, 62, 45, 59, 119]  # P4/16
  - [116, 90, 156, 198, 373, 326]  # P5/32

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]],  # 4 <- P3 (128)
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],  # 6 <- P4 (256)
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]],  # 8
   [-1, 1, SPPF, [1024, 5]],  # 9 <- P5 (512)
  ]

head:
  # ---- 自顶向下 (top-down) ----
  [[-1, 1, Conv, [512, 1, 1]],  # 10 P5 降维 512->256
   [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 11
   [[-1, 6], 1, BiFPN_Fusion, []],  # 12 TD-P4: up(P5') + P4 (256)
   [-1, 1, Conv, [256, 1, 1]],  # 13 降维 256->128
   [-1, 1, nn.Upsample, [None, 2, "nearest"]],  # 14
   [[-1, 4], 1, BiFPN_Fusion, []],  # 15 TD-P3: up(P4') + P3 (128)
   # ---- 自底向上 (bottom-up) ----
   [-1, 1, Conv, [512, 3, 2]],  # 16 下采样 128->256
   [[-1, 12, 6], 1, BiFPN_Fusion, []],  # 17 BU-P4: down(P3') + TD-P4 + 原始P4 三输入同层融合
   [-1, 1, Conv, [1024, 3, 2]],  # 18 下采样 256->512
   [[-1, 9], 1, BiFPN_Fusion, []],  # 19 BU-P5: down(P4'') + 原始P5
   # ---- 检测头 ----
   [15, 1, C3, [256, False]],  # 20 P3/8-small (128)
   [17, 1, C3, [512, False]],  # 21 P4/16-medium (256)
   [19, 1, C3, [1024, False]],  # 22 P5/32-large (512)
   [[20, 21, 22], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
